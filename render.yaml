# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy with: Render dashboard -> New -> Blueprint -> pick this repository.
# It creates the PostgreSQL database and the API service together, and wires
# DATABASE_URL between them. SECRET_KEY is generated by Render, so no secret
# ever passes through a terminal or a commit.
#
# Free-tier notes, both deliberate:
#   * No persistent disk. Free instances cannot mount one, so uploaded PDFs
#     live only until the next deploy or restart. Everything parsed out of
#     them (units, topics, key points, paper scores) is in PostgreSQL and
#     survives. To keep the files too, upgrade the service and uncomment the
#     `disk:` block plus the UPLOAD_DIR override below.
#   * Free services sleep after ~15 minutes idle; the next request pays a
#     cold start of roughly 50 seconds.

databases:
  - name: studypilot-db
    databaseName: studypilot
    user: studypilot
    plan: free
    # Must match the web service's region, or the internal connection string
    # the service is given will not resolve.
    region: frankfurt

services:
  - type: web
    # onrender.com hostnames are global, and `studypilot-api` is already taken
    # by an unrelated service. Naming it explicitly keeps the URL predictable
    # instead of letting Render append a random suffix.
    name: studypilot-ai-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Migrations run here rather than in a preDeployCommand, which is a paid
    # feature. gunicorn only starts once `alembic upgrade head` succeeds.
    startCommand: >-
      alembic upgrade head &&
      gunicorn app.main:app
      --worker-class uvicorn.workers.UvicornWorker
      --workers 2
      --bind 0.0.0.0:$PORT
      --timeout 120
      --graceful-timeout 30
      --access-logfile -
      --error-logfile -
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: studypilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      # Set once the frontend is deployed. Needed only for a custom domain —
      # *.vercel.app is already matched by a regex in app/main.py.
      - key: FRONTEND_URL
        sync: false

    # Uncomment together with a paid instance type to keep uploaded files
    # across deploys:
    # disk:
    #   name: studypilot-uploads
    #   mountPath: /var/data
    #   sizeGB: 1
    # ...and add:
    #   - key: UPLOAD_DIR
    #     value: /var/data/uploads
